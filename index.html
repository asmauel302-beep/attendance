<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نظام الحضور بالـ NFC</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', Tahoma, sans-serif;
    background: linear-gradient(135deg, #0a1628 0%, #1a2a4a 100%);
    color: #fff;
    min-height: 100vh;
    padding: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .header {
    width: 100%;
    max-width: 400px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
    padding: 8px 0;
  }
  .header .title {
    font-size: 16px;
    font-weight: bold;
  }
  .header .icon-btn {
    background: rgba(255,255,255,0.1);
    border: none;
    color: #fff;
    width: 40px;
    height: 40px;
    border-radius: 10px;
    font-size: 18px;
    cursor: pointer;
  }
  h1 { font-size: 20px; margin-bottom: 6px; text-align: center; }
  .subtitle { font-size: 13px; color: #8fa3c8; margin-bottom: 20px; text-align: center; }
  
  .nfc-wrapper {
    position: relative;
    width: 200px;
    height: 200px;
    margin-bottom: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .nfc-ring {
    position: absolute;
    width: 200px; height: 200px;
    border-radius: 50%;
    border: 2px solid #1e88e5;
    opacity: 0.5;
  }
  .nfc-circle {
    width: 160px; height: 160px;
    border-radius: 50%;
    background: #1e88e5;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    transition: all 0.3s;
    box-shadow: 0 0 0 8px rgba(30, 136, 229, 0.2);
  }
  .nfc-circle:active { transform: scale(0.95); }
  .nfc-circle.scanning {
    animation: pulse 1.5s infinite;
    background: #4caf50;
  }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 8px rgba(76, 175, 80, 0.3); }
    50% { box-shadow: 0 0 0 30px rgba(76, 175, 80, 0); }
  }
  .nfc-icon { font-size: 60px; }
  
  .btn {
    padding: 14px 28px;
    border-radius: 12px; border: none;
    background: #1e88e5; color: #fff;
    font-size: 15px; font-weight: bold;
    cursor: pointer; width: 100%; max-width: 360px;
    margin-bottom: 12px;
    transition: background 0.2s;
  }
  .btn:active { background: #1565c0; }
  .btn:disabled { background: #555; cursor: not-allowed; }
  .btn-secondary { background: #2a3f5f; }
  
  .result-box {
    padding: 18px;
    background: rgba(255, 255, 255, 0.08);
    border-radius: 12px;
    width: 100%; max-width: 360px;
    min-height: 50px;
    text-align: center;
    font-size: 15px;
    margin-bottom: 16px;
    border: 1px solid rgba(255, 255, 255, 0.1);
    line-height: 1.7;
  }
  .result-box.success { background: rgba(76, 175, 80, 0.2); border-color: #4caf50; }
  .result-box.error { background: rgba(244, 67, 54, 0.2); border-color: #f44336; }
  .result-box.info { background: rgba(30, 136, 229, 0.2); border-color: #1e88e5; }
  
  .log-section {
    width: 100%; max-width: 360px;
    margin-top: 20px;
  }
  .log-section h2 {
    font-size: 15px; margin-bottom: 12px;
    color: #8fa3c8; text-align: center;
  }
  .log-item {
    padding: 12px 14px;
    background: rgba(255, 255, 255, 0.05);
    border-radius: 10px;
    margin-bottom: 8px;
    font-size: 13px;
    border-right: 4px solid #4caf50;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .log-item.exit { border-right-color: #ff9800; }
  .log-item .name { font-weight: bold; font-size: 14px; }
  .log-item .time { color: #8fa3c8; font-size: 12px; margin-top: 4px; }
  .log-item .badge {
    font-size: 11px;
    padding: 3px 8px;
    border-radius: 6px;
    background: rgba(76, 175, 80, 0.3);
    color: #a5d6a7;
  }
  .log-item.exit .badge {
    background: rgba(255, 152, 0, 0.3);
    color: #ffcc80;
  }
  .empty-log { text-align: center; color: #8fa3c8; font-size: 13px; padding: 12px; }
  
  .info { margin-top: 16px; font-size: 12px; color: #8fa3c8; text-align: center; max-width: 360px; line-height: 1.6; }
</style>
</head>
<body>

<div class="header">
  <div class="title">📊 سجل التصحيح</div>
  <button class="icon-btn" id="diagBtn">📡</button>
</div>

<h1>محطة الحضور</h1>
<p class="subtitle">نظام الحضور بالـ NFC</p>

<div class="nfc-wrapper">
  <div class="nfc-ring"></div>
  <div class="nfc-circle" id="nfcCircle">
    <div class="nfc-icon">📶</div>
  </div>
</div>

<button class="btn" id="scanBtn">امسح البطاقة</button>

<div class="result-box" id="result">في انتظار البطاقة...</div>

<div class="log-section">
  <h2>سجل اليوم</h2>
  <div id="logList"><p class="empty-log">لا يوجد سجل بعد</p></div>
  <button class="btn btn-secondary" id="clearBtn" style="margin-top:12px;">مسح السجل</button>
</div>

<p class="info">⚠️ يعمل فقط على Chrome Android مع تفعيل NFC</p>

<script>
const scanBtn = document.getElementById('scanBtn');
const resultBox = document.getElementById('result');
const nfcCircle = document.getElementById('nfcCircle');
const logList = document.getElementById('logList');
const clearBtn = document.getElementById('clearBtn');
const diagBtn = document.getElementById('diagBtn');

// قاعدة بيانات الموظفين
const EMPLOYEES = {
  'ismail': { name: 'إسماعيل', department: 'الإدارة' },
};

let isScanning = false;

// ===== سجل الحضور =====
function getLog() {
  return JSON.parse(localStorage.getItem('attendance_log') || '[]');
}
function saveLog(log) {
  localStorage.setItem('attendance_log', JSON.stringify(log));
}
function renderLog() {
  const log = getLog();
  if (log.length === 0) {
    logList.innerHTML = '<p class="empty-log">لا يوجد سجل بعد</p>';
    return;
  }
  logList.innerHTML = log.slice().reverse().map(item => `
    <div class="log-item ${item.type === 'خروج' ? 'exit' : ''}">
      <div>
        <div class="name">${item.name}</div>
        <div class="time">${item.time}</div>
      </div>
      <div class="badge">${item.type}</div>
    </div>
  `).join('');
}

// ===== تسجيل الدخول/الخروج =====
function registerAttendance(employeeKey) {
  const emp = EMPLOYEES[employeeKey];
  if (!emp) {
    showResult('❌ بطاقة غير مسجلة<br>الرمز: ' + employeeKey, 'error');
    return;
  }

  const now = new Date();
  const timeStr = now.toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' });
  const dateStr = now.toLocaleDateString('ar-EG');

  const log = getLog();
  const todayLogs = log.filter(l => l.name === emp.name && l.date === dateStr);
  const lastEntry = todayLogs[todayLogs.length - 1];

  if (!lastEntry || lastEntry.type === 'خروج') {
    log.push({ name: emp.name, type: 'دخول', time: timeStr, date: dateStr });
    saveLog(log);
    showResult(`✅ أهلاً ${emp.name}<br><small>${emp.department}</small><br><br>🟢 تم تسجيل الدخول — ${timeStr}`, 'success');
  } else {
    log.push({ name: emp.name, type: 'خروج', time: timeStr, date: dateStr });
    saveLog(log);
    showResult(`👋 وداعاً ${emp.name}<br><br>🟠 تم تسجيل الخروج — ${timeStr}`, 'success');
  }
  renderLog();
}

// ===== المسح =====
scanBtn.addEventListener('click', async () => {
  if (isScanning) return;
  if (!('NDEFReader' in window)) {
    showResult('❌ المتصفح لا يدعم NFC. استخدم Chrome على أندرويد.', 'error');
    return;
  }
  try {
    const ndef = new NDEFReader();
    await ndef.scan();
    isScanning = true;
    scanBtn.textContent = 'جاري المسح...';
    scanBtn.disabled = true;
    nfcCircle.classList.add('scanning');
    showResult('📡 قرّب البطاقة من ظهر الجوال...', 'info');

    ndef.onreading = event => {
      let name = '';
      for (const record of event.message.records) {
        if (record.recordType === 'text') {
          const decoder = new TextDecoder(record.encoding || 'utf-8');
          name = decoder.decode(record.data).trim();
        }
      }
      if (name) registerAttendance(name);
      else showResult('⚠️ بطاقة بدون بيانات NDEF نصية', 'error');

      setTimeout(() => {
        isScanning = false;
        scanBtn.textContent = 'امسح البطاقة';
        scanBtn.disabled = false;
        nfcCircle.classList.remove('scanning');
      }, 2000);
    };

    ndef.onreadingerror = () => showResult('❌ فشل قراءة البطاقة', 'error');

  } catch (err) {
    showResult('❌ خطأ: ' + err.message, 'error');
    isScanning = false;
    scanBtn.textContent = 'امسح البطاقة';
    scanBtn.disabled = false;
    nfcCircle.classList.remove('scanning');
  }
});

// ===== مسح السجل =====
clearBtn.addEventListener('click', () => {
  if (confirm('هل تريد مسح كل سجل الحضور؟')) {
    localStorage.removeItem('attendance_log');
    renderLog();
    showResult('تم مسح السجل', 'info');
  }
});

// ===== التشخيص =====
diagBtn.addEventListener('click', () => {
  const supported = 'NDEFReader' in window;
  alert('تشخيص:\n' +
    '- دعم NFC: ' + (supported ? '✅ مدعوم' : '❌ غير مدعوم') + '\n' +
    '- المتصفح: ' + navigator.userAgent.split(' ').slice(-2).join(' ') + '\n' +
    '- HTTPS: ' + (location.protocol === 'https:' ? '✅' : '❌'));
});

function showResult(text, type) {
  resultBox.innerHTML = text;
  resultBox.className = 'result-box';
  if (type) resultBox.classList.add(type);
}

// عند التحميل
renderLog();
</script>

</body>
</html>
